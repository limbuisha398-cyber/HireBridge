<!DOCTYPE html>
<html>

<head>
    <title>HireBridge - My Profile</title>
</head>

<body>

    <h1>My Profile</h1>

    {% if messages %}
    {% for message in messages %}
    <p>{{ message }}</p>
    {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Changes</button>
    </form>

    <br>

    <a href="{% url 'dashboard' %}">Back to Dashboard</a>

</body>

</html>
