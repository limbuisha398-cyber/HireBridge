{% extends 'base.html' %}
{% block title %}Register - HireBridge{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 mt-3">
      <h3 class="text-center mb-4" style="color:#1F4E79;">Create Your HireBridge Account</h3>

      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-2">Register</button>
      </form>

      <p class="text-center mt-3 mb-0">
        Already have an account? <a href="{% url 'login' %}">Login here</a>
      </p>
    </div>
  </div>
</div>

<style>
  form p { margin-bottom: 1rem; }
  form label { display: block; font-weight: 500; margin-bottom: 4px; color: #333; }
  form input, form select, form textarea {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ced4da;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  form input:focus, form select:focus, form textarea:focus {
    border-color: #1F4E79;
    outline: none;
    box-shadow: 0 0 0 2px rgba(31,78,121,0.15);
  }
  form ul.errorlist {
    color: #dc3545;
    font-size: 0.85rem;
    list-style: none;
    padding-left: 0;
    margin-top: 4px;
  }
</style>
{% endblock %}
