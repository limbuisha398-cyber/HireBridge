{% extends 'base.html' %}

{% block title %}Change Password - HireBridge{% endblock %}

{% block content %}

<h3 class="mb-4" style="color:#1F4E79;">Admin Password Management</h3>

<div class="card p-4" style="max-width:600px;">
    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Change Password
        </button>

        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
